<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Oracle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<style>
    :root {
        --ink: #1d1b2f;
        --mist: #e9e0ff;
        --lavender: #b9a8ff;
        --pearl: #f7f3ff;
        --rose: #f7c6d3;
        --aqua: #b6f3ff;
        --deep: #2b1f4a;
    }
    body {
        min-height: 100vh;
        color: var(--ink);
        font-family: "Quicksand", sans-serif;
        background:
            radial-gradient(1200px 600px at 10% 10%, rgba(255, 255, 255, 0.55), transparent 60%),
            radial-gradient(900px 500px at 90% 20%, rgba(182, 243, 255, 0.6), transparent 60%),
            radial-gradient(900px 700px at 30% 90%, rgba(247, 198, 211, 0.5), transparent 60%),
            linear-gradient(135deg, #f1ecff 0%, #dfe2ff 45%, #c6f2ff 100%);
        background-attachment: fixed;
    }
    .halo {
        position: fixed;
        inset: -20vmax;
        pointer-events: none;
        filter: blur(60px);
        opacity: 0.4;
        background: conic-gradient(from 120deg, var(--lavender), var(--aqua), var(--rose), var(--lavender));
        animation: drift 24s linear infinite;
    }
    @keyframes drift {
        0% { transform: translate3d(0, 0, 0) rotate(0deg); }
        50% { transform: translate3d(6vmax, -4vmax, 0) rotate(180deg); }
        100% { transform: translate3d(0, 0, 0) rotate(360deg); }
    }
    .panel {
        background: rgba(255, 255, 255, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(43, 31, 74, 0.15);
        backdrop-filter: blur(10px);
        padding: 32px;
    }
    h1, h3 {
        font-family: "Cinzel", serif;
        color: var(--deep);
        letter-spacing: 0.5px;
    }
    .lead {
        color: #3c355c;
    }
    .dream-input {
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(185, 168, 255, 0.6);
        border-radius: 16px;
        padding: 14px 16px;
        box-shadow: inset 0 0 18px rgba(185, 168, 255, 0.15);
    }
    .dream-input:focus {
        border-color: var(--lavender);
        box-shadow: 0 0 0 0.2rem rgba(185, 168, 255, 0.35);
    }
    .dream-btn {
        background: linear-gradient(135deg, #9f8cff, #7fd6ff);
        border: none;
        color: #1b1633;
        font-weight: 600;
        padding: 12px 18px;
        border-radius: 14px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 10px 20px rgba(125, 214, 255, 0.35);
    }
    .dream-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(125, 214, 255, 0.45);
    }
    .result-box {
        background: rgba(247, 243, 255, 0.85);
        border: 1px solid rgba(185, 168, 255, 0.45);
        border-radius: 18px;
        padding: 18px;
    }
    .dream-image {
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(43, 31, 74, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.7);
    }
    .tiny-note {
        font-size: 0.95rem;
        color: #5a4f7f;
    }
    @media (max-width: 576px) {
        .panel { padding: 22px; }
        h1 { font-size: 1.9rem; }
    }
</style>
<body>
    <div class="halo" aria-hidden="true"></div>
    <div class="container text-center py-5">
        <div class="panel mx-auto col-lg-8">
            <h1 class="display-5">Tell me your dream</h1>
            <p class="lead">I will translate its symbols into a quiet, Jungian reflection.</p>
            <form method="POST" class="mx-auto col-lg-10">
                <div class="mb-3 text-start">
                    <label for="prompt" class="form-label tiny-note">Your dream</label>
                    <textarea id="prompt" name="prompt" rows="4" class="form-control dream-input" placeholder="Enter your dream..."></textarea>
                </div>
                <div class="d-grid">
                    <input type="submit" value="Reveal the dream" class="dream-btn">
                </div>
            </form>
            {% if result %}
                <h3 class="mt-4">Interpretation</h3>
                <div class="result-box">{{ result }}</div>

                {% if image_path %}
                    <h3 class="mt-4">Dream Visualization</h3>
                    <img src="{{ url_for('static', filename=image_path) }}"
                         class="img-fluid dream-image mt-3"
                         alt="Generated dream image">
                {% endif %}
            {% endif %}
        </div>
    </div>
</body>
</html>
